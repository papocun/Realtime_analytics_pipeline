[project]
name = "realtimepipeline"
version = "0.1.0"
description = "End-to-end music analytics data engineering pipeline: Kafka → MinIO → Airflow → Snowflake → dbt → Next.js dashboard"
readme = "README.md"
authors = [
    { name = "Divyanshu Tiwari", email = "immadivyansh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.115",
    "cryptography>=50.0.2",
    "dbt-core>=1.12.6",
    "dbt-snowflake>=1.12.3",
    "faker>=40.43.0",
    "kafka>=1.3.5",
    "kafka-python>=3.0.11",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python>=4.8.0",
]

[project.scripts]
realtimepipeline = "realtimepipeline:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
