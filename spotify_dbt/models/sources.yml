version: 2

sources:
  - name: bronze
    database: SPOTIFY_DB
    schema: BRONZE
    description: "Raw landing tables for Spotify event stream data ingested from MinIO."
    tables:
      - name: spotify_events_bronze
        identifier: SPOTIFY_EVENTS_BRONZE
        description: "Raw, append-only Spotify events containing user stream interactions."
        columns:
          - name: EVENT_ID
            description: "Unique event identifier (UUIDv4) generated at source event occurrence."
            data_tests:
              - not_null
          - name: USER_ID
            description: "Identifier of the user generating the event."
          - name: SONG_ID
            description: "Deterministic UUIDv5 of the song (derived from artist::song)."
          - name: ARTIST_NAME
            description: "Artist name as delivered by the source system."
          - name: SONG_NAME
            description: "Song title as delivered by the source system."
          - name: EVENT_TYPE
            description: "User interaction type (play, pause, skip, add_to_playlist)."
          - name: DEVICE_TYPE
            description: "Device category (mobile, desktop, web)."
          - name: COUNTRY
            description: "ISO two-letter country code where the event originated."
          - name: TIMESTAMP
            description: "Original ISO 8601 UTC timestamp string generated by the simulator."
